[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tuner-backend"
version = "0.1.0"
description = "FastAPI backend for tuner: browse and serve Hugging Face embedding models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "huggingface-hub>=1.27.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Sync driver, used only by Alembic; see migrations/env.py.
    "psycopg[binary]>=3.2",
    # Required by FastAPI to parse the multipart uploads /embed takes.
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

# Only the app ships; migrations/ and scripts/ are run in place, and without
# this setuptools refuses to guess between them.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency defaults are evaluated per request, not once at import.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form"]

[tool.pytest.ini_options]
testpaths = ["tests"]
